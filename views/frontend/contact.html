<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | HostelPro</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../../index.html"><span class="brand-mark">H</span><span>HostelPro</span></a>
    <nav class="nav">
      <a href="../../index.html">Home</a>
      <a href="about.html">About</a>
      <a class="active" href="contact.html">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main class="page-title">
    <h1>Contact hostel office</h1>
    <p>Use this page as the public-facing contact area for students and parents. The form is frontend-only and can be connected to email later.</p>
  </main>
  <section class="section">
    <div class="card" style="max-width:760px">
      <form class="form-grid" onsubmit="event.preventDefault(); alert('Message captured for demo.');">
        <label>Name <input required placeholder="Your name"></label>
        <label>Email <input required type="email" placeholder="you@example.com"></label>
        <label>Message <textarea required placeholder="How can the hostel office help?"></textarea></label>
        <button class="btn primary" type="submit">Send Message</button>
      </form>
    </div>
  </section>
</body>
