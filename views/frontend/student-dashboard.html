<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | HostelPro</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">H</span><span>HostelPro</span></div>
      <nav class="side-nav">
        <button class="active" data-section="profile">Profile</button>
        <button data-section="applications">Room Application</button>
        <button data-section="complaints">Complaints</button>
        <button data-section="payments">Payments</button>
        <button data-logout>Logout</button>
      </nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Student Dashboard</h1>
          <p class="muted">Welcome, <span id="studentName"></span></p>
        </div>
      </div>

      <section id="profile" class="dash-section panel">
        <h2>Profile Details</h2>
        <form id="profileForm" class="form-grid">
          <label>Name <input name="name" required></label>
          <label>Phone <input name="phone"></label>
          <label>Department <input name="department"></label>
          <label>Year <input name="year"></label>
          <label>Address <textarea name="address"></textarea></label>
          <label>Guardian Name <input name="guardianName"></label>
          <label>Guardian Phone <input name="guardianPhone"></label>
          <button class="btn primary" type="submit">Update Profile</button>
        </form>
      </section>

      <section id="applications" class="dash-section panel hidden">
        <h2>Apply for Hostel Room</h2>
        <form id="applicationForm" class="form-grid">
          <label>Preferred Block <input name="preferredBlock" placeholder="A"></label>
          <label>Preferred Floor <input name="preferredFloor" type="number" min="0" value="1"></label>
          <label>Notes <textarea name="notes" placeholder="Any room preference or medical need"></textarea></label>
          <button class="btn primary" type="submit">Submit Application</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Block</th><th>Floor</th><th>Status</th><th>Allotted Room</th></tr></thead>
            <tbody id="applicationRows"></tbody>
          </table>
        </div>
      </section>

      <section id="complaints" class="dash-section panel hidden">
        <div class="toolbar">
          <h2>Complaint Management</h2>
          <input id="complaintSearch" placeholder="Search complaints">
        </div>
        <form id="complaintForm" class="form-grid">
          <label>Title <input name="title" required placeholder="Wi-Fi issue"></label>
          <label>Category
            <select name="category">
              <option>Maintenance</option><option>Food</option><option>Internet</option><option>Roommate</option><option>Security</option><option>Other</option>
            </select>
          </label>
          <label>Description <textarea name="description" required></textarea></label>
          <button class="btn primary" type="submit">Raise Complaint</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Admin Note</th></tr></thead>
            <tbody id="complaintRows"></tbody>
          </table>
        </div>
        <div class="row-actions">
          <button id="complaintPrev" class="btn">Prev</button>
          <span id="complaintPage" class="muted"></span>
          <button id="complaintNext" class="btn">Next</button>
        </div>
      </section>

      <section id="payments" class="dash-section panel hidden">
        <h2>Fee Details</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Term</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Method</th></tr></thead>
            <tbody id="paymentRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="loader"><div class="spinner"></div></div>
  <script src="../../public/js/api.js"></script>
  <script src="../../public/js/student-dashboard.js"></script>
</body>
</html>
