<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMS Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="login-body">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="auth-shell">
      <section class="auth-copy">
        <div class="eyebrow">Account recovery</div>
        <h1>Reset Your Password</h1>
        <p>Reset password for both admin and student accounts using your registered email address.</p>
      </section>

      <section class="auth-card">
        <h2>Forgot Password</h2>
        <p class="helper-note">Enter account email and set a new password.</p>
        <form id="forgot-password-form" class="stack-form">
          <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
          <label>
            <span>New Password</span>
            <input type="password" name="newPassword" placeholder="At least 6 characters" minlength="6" required />
          </label>
          <label>
            <span>Confirm New Password</span>
            <input
              type="password"
              name="confirmPassword"
              placeholder="Re-enter new password"
              minlength="6"
              required
            />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Reset Password</button>
          <p id="forgot-password-error" class="form-error"></p>
          <p class="inline-link-wrap"><a class="inline-link" href="./login.html">Back to Login</a></p>
        </form>
      </section>
    </main>

    <script src="./js/server-wakeup-loader.js"></script>
    <script src="./js/hms-common.js"></script>
    <script src="./js/forgot-password.js"></script>
  </body>
</html>
