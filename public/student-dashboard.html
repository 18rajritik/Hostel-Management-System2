<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMS Student Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="student-body">
    <div class="dashboard-layout student-layout">
      <aside class="sidebar sidebar-light">
        <div>
          <div class="student-badge">
            <div class="student-avatar" id="student-avatar">S</div>
            <div>
              <strong id="student-name">Student</strong>
              <p id="student-email">student@hostel.com</p>
            </div>
          </div>
          <nav class="sidebar-nav light-nav">
            <button class="nav-link active" data-section="profile">My Profile</button>
            <button class="nav-link" data-section="room">My Room</button>
            <button class="nav-link" data-section="fees">My Fees</button>
            <button class="nav-link" data-section="complaints">My Complaints</button>
            <button class="nav-link" data-section="notices">Notices</button>
          </nav>
        </div>
        <button class="btn btn-secondary" id="student-logout" type="button">Logout</button>
      </aside>

      <main class="dashboard-main student-main">
        <header class="page-topbar">
          <div>
            <div class="eyebrow">Student portal</div>
            <h1 id="student-section-title">My Profile</h1>
          </div>
          <div id="student-loader" class="inline-loader hidden"></div>
        </header>

        <section id="profile" class="section-panel active">
          <div id="profile-card" class="profile-grid"></div>
        </section>

        <section id="room" class="section-panel">
          <div id="room-card" class="room-showcase"></div>
        </section>

        <section id="fees" class="section-panel">
          <div class="stats-grid student-stats">
            <article class="stat-card">
              <p>Total Paid</p>
              <h2 id="total-paid">0</h2>
            </article>
            <article class="stat-card">
              <p>Total Pending</p>
              <h2 id="total-pending">0</h2>
            </article>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Month</th>
                  <th>Amount</th>
                  <th>Payment Mode</th>
                  <th>Status</th>
                  <th>Paid Date</th>
                </tr>
              </thead>
              <tbody id="student-fees-table"></tbody>
            </table>
          </div>
        </section>

        <section id="complaints" class="section-panel">
          <div class="section-head">
            <div>
              <h2>My Complaints</h2>
              <p>Track your hostel requests and issue status.</p>
            </div>
            <button class="btn btn-primary" data-modal="student-complaint-modal">File New Complaint</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Date Filed</th>
                </tr>
              </thead>
              <tbody id="student-complaints-table"></tbody>
            </table>
          </div>
        </section>

        <section id="notices" class="section-panel">
          <div class="notice-grid" id="student-notices"></div>
        </section>
      </main>
    </div>

    <div id="student-complaint-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h3>File New Complaint</h3>
          <button class="icon-btn" data-close-modal>&times;</button>
        </div>
        <form id="student-complaint-form" class="grid-form">
          <label class="full"><span>Title</span><input name="title" required /></label>
          <label>
            <span>Category</span>
            <select name="category">
              <option value="maintenance">Maintenance</option>
              <option value="electrical">Electrical</option>
              <option value="cleanliness">Cleanliness</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label class="full"><span>Description</span><textarea name="description" rows="5" required></textarea></label>
          <button class="btn btn-primary full" type="submit">Submit Complaint</button>
        </form>
      </div>
    </div>

    <script src="./js/hms-common.js"></script>
    <script src="./js/student-dashboard.js"></script>
  </body>
</html>
